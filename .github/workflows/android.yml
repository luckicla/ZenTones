name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        working-directory: android
        env:
          FREESOUND_KEY: ${{ secrets.FREESOUND_KEY }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk Zentones.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zentones-apk
          path: Zentones.apk
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Última APK
          prerelease: true
          files: Zentones.apk
